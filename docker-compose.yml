version: '3.8'

services:
  edge-hub:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-ward-hub
    ports:
      - "8000:8000"
    environment:
      - SW_ENVIRONMENT=production
      - SW_SQLITE_SYNCHRONOUS=FULL
      - SW_AUTO_CREATE_DB=true
      - SW_ENABLE_DOCS=false
      - SW_DEVICE_TRUST_MODE=enforce
      - SW_AUDIT_LOG_PATH=/app/data/audit_events.jsonl
      - SW_DATABASE_PATH=/app/data/ward_hub.db
      - SW_TELEMETRY_STATE_PATH=/app/data/edge_telemetry_state.json
      - SW_FORENSIC_ANCHOR_PATH=/app/data/forensic_anchors.jsonl
      # OpenID Connect (OIDC) Authentication Configuration
      - SW_AUTH_MODE=oidc
      - SW_OIDC_ISSUER=${SW_OIDC_ISSUER:-https://securetoken.google.com/YOUR_PROJECT_ID}
      - SW_OIDC_AUDIENCE=${SW_OIDC_AUDIENCE:-YOUR_PROJECT_ID}
      - SW_OIDC_JWKS_URL=${SW_OIDC_JWKS_URL:-https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com}
      - SW_OIDC_ALGORITHMS=RS256
    volumes:
      - edge-data:/app/data
    restart: always

  virtual-streamer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-ward-streamer
    command: python virtual_hardware_hub_bridge.py
    environment:
      - HUB_BASE_URL=http://edge-hub:8000
    depends_on:
      - edge-hub
    restart: on-failure

volumes:
  edge-data:
    driver: local
