name: Smart Ward Hub CI

on:
  push:
    branches: [main, 'audit/**', 'feat/**', 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smart-ward-hub-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Validate shell scripts
        run: bash -n scripts/verify_local.sh run_mtls.sh

      - name: Check dependency consistency
        run: python -m pip check

      - name: Audit dependencies
        run: |
          python -m pip install --upgrade pip-audit
          pip-audit -r requirements.txt

      - name: Run Bandit SAST scan
        run: |
          python -m pip install bandit
          python -m bandit -r . -x ./test_*.py -ll -ii

      - name: Scan for secret leaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whitespace
        run: git diff --check

      - name: Run master regression suite
        run: python run_all_tests.py

      - name: Confirm generated runtime artifacts are not tracked
        run: |
          if git status --short --untracked-files=all | grep -E '(ward_hub\.db|audit_events\.jsonl|edge_telemetry_state\.json|forensic_anchors\.jsonl|reliability_validation_result\.json|pilot_simulation_result\.json|serial_bench_evidence\.json)'; then
            echo 'Runtime artifacts must not be tracked or added by CI.'
            exit 1
          fi
